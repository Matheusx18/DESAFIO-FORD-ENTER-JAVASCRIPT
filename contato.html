<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ford</title>    
    <link href="css/reset.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/form.css" rel="stylesheet">
    <script src="js/form.js"></script>
</head>
<body>
    <header>       
        <div>
            <img src="img/logo-ford-256.png" width="150" class="logo" />
        </div>
        <nav>
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="lancamento.html">Lançamento</a>
                </li>
                <li>
                    <a href="contato.html">Contato</a>
                </li>
            </ul>
        </nav>

    </header>
    <main>
        <div class="forms">
            <div>
                <img src="img/xls 2.2 diesel.jpg">
            </div>
            <div>
                <h2 class="titulo">Sobre Você</h2>
            <form onsubmit="Post(this);">
                <input type="text" name="nome" placeholder="NOME*" class="fordform" required>
                <input type="text" name="email" placeholder="E-MAIL*" class="fordform" required>
                <input type="text" name="cpf" placeholder="CPF*" class="fordform" required>
                <input type="text" name="sobrenome" placeholder="SOBRENOME*" class="fordform" required>
                <input type="text" name="telefone" placeholder="TELEFONE*" class="fordform" required>
                <select name="contato" class="fordform" required>
                    <option selected>COMO DESEJA SER CONTATADO</option>
                    <option>TELEFONE</option>
                    <option>E-MAIL</option>
                </select>
            <button type="submit">Enviar</button>
            </form>
            </div>
        </div>
    </main>
   <footer>
  <nav id="social">
    <ul>
      <li><span class="redessociais">Redes Sociais</span></li>
      <li>
        <a href="https://www.facebook.com/FordBrasil/?locale=pt_BR" target="_blank" rel="noopener noreferrer" title="Facebook">
          <img src="img/facebook-50.png" alt="Facebook" class="social-icon" />
        </a>
      </li>
      <li>
        <a href="https://www.youtube.com/fordbrasil" target="_blank" rel="noopener noreferrer" title="YouTube">
          <img src="img/youtube-squared-50.png" alt="YouTube" class="social-icon" />
        </a>
      </li>
      <li>
        <a href="https://www.instagram.com/fordbrasil/" target="_blank" rel="noopener noreferrer" title="Instagram">
          <img src="img/instagram-logo-50.png" alt="Instagram" class="social-icon" />
        </a>
      </li>
    </ul>
  </nav>

  <div class="footer-logo">
    <img src="img/ford-96.png" width="70" alt="Ford Logo" />
  </div>
</footer>   
</body>
</html>
